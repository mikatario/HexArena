<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヘックス・アリーナ編集室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f5f7fb; --line:#d6dce8; --ink:#1a2130; --sub:#5c6680;
  --accent:#9a6b12; --accent-bg:#fbf1dc; --focus:#2f6fdb;
  --ok:#1f8a4c; --ok-bg:#e3f5ea; --warn:#b3261e; --warn-bg:#fde8e6;
  --c1:#8a8a99; --c2:#2f9e5d; --c3:#2f6fd0; --c4:#9a4fd0; --c5:#c79212;
  --font:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --display:"Dela Gothic One","BIZ UDPGothic","Yu Gothic UI",sans-serif;
  --mono:"JetBrains Mono","Consolas","BIZ UDPGothic",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10141d; --surface:#171c28; --surface2:#1d2331; --line:#2c3446; --ink:#e6e9f1; --sub:#98a1b8;
    --accent:#e8b54d; --accent-bg:#2e2616; --focus:#6ea1ff;
    --ok:#5fd08e; --ok-bg:#15291e; --warn:#ff8a80; --warn-bg:#331a1a;
    --c1:#a4a4b2; --c2:#4cc07d; --c3:#5b93ee; --c4:#b67ae6; --c5:#e8b54d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10141d; --surface:#171c28; --surface2:#1d2331; --line:#2c3446; --ink:#e6e9f1; --sub:#98a1b8;
  --accent:#e8b54d; --accent-bg:#2e2616; --focus:#6ea1ff;
  --ok:#5fd08e; --ok-bg:#15291e; --warn:#ff8a80; --warn-bg:#331a1a;
  --c1:#a4a4b2; --c2:#4cc07d; --c3:#5b93ee; --c4:#b67ae6; --c5:#e8b54d;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1400px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em;margin:0;text-wrap:balance}
.brand .meta{color:var(--sub);font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--sub)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
:root[data-theme="dark"] button.primary{color:#1a1406}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#1a1406}}
button:disabled{opacity:.45;cursor:default}
button.danger{color:var(--warn)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:12px}
.pill{font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--sub)}
.pill.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.pill.bad{background:var(--warn-bg);border-color:transparent;color:var(--warn);cursor:pointer}
.pill.dirty{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 14px;color:var(--sub);font-weight:700}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--sub);margin-left:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{min-width:0;width:220px;max-width:100%}
.toolbar .hint{color:var(--sub);font-size:12.5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:4px 6px;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none}
input.num{font-family:var(--mono);font-variant-numeric:tabular-nums;width:74px;text-align:right}
input.num.s{width:58px}
input.bad,select.bad{border-color:var(--warn);background:var(--warn-bg)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface2);font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.03em;z-index:1}
tr:last-child td{border-bottom:none}
td.pv{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--sub);font-size:12px}
.cost{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cost1{background:var(--c1)}.cost2{background:var(--c2)}.cost3{background:var(--c3)}.cost4{background:var(--c4)}.cost5{background:var(--c5)}
.chips{display:flex;gap:4px;flex-wrap:nowrap;align-items:center}
.chips select{width:48px}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.chip:hover{border-color:var(--warn);color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .kind{font-size:11.5px;font-weight:400;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.field{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--sub)}
.tiers{font-size:12.5px;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.tiers b{font-family:var(--mono);color:var(--accent);font-weight:600;margin-right:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font-size:15px;margin:0 0 10px}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px;max-width:68ch}
.steps code,.mono{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:4px}
.errors{margin:0;padding-left:1.2em;color:var(--warn);max-height:220px;overflow:auto}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.banner.info{background:var(--accent-bg);color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(720px,100%);display:flex;flex-direction:column;gap:12px}
.dialog textarea{width:100%;height:240px;font-family:var(--mono);font-size:12px}
.muted{color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-size:13.5px;max-width:calc(100% - 32px)}
.history li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:4px;border-bottom:1px solid var(--line)}
.history{list-style:none;margin:0;padding:0}
@media (max-width:640px){.brand h1{font-size:19px}th,td{padding:4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>ヘックス・アリーナ編集室</h1>
      <div class="meta" id="meta">読み込み中…</div>
    </div>
    <div class="actions">
      <button id="btnSave" class="primary" title="チーム共有の作業データとして保存">共有に保存</button>

      <button id="btnImport">読み込む</button>

  <div class="status" id="status"></div>
  <div id="bannerBox"></div>

</div>

    <input type="file" id="impFile" accept=".json,application/json">
    <textarea id="impText" placeholder='{"data_version": ... } をここに貼り付け'></textarea>
    <div class="row" style="justify-content:flex-end">
      <button id="impInitial">同梱の初期値に戻す</button>
      <button id="impCancel">やめる</button>
      <button id="impOk" class="primary">読み込む</button>
    </div>
  </div>
</div>

function abilityValue(sk, cost, star){
  const base = num(sk.power);

  let m = [1,1.5,2.5][star-1]; if (cost === 5 && star === 3) m = 4;
  return base * (1 + 0.4*(cost-1)) * m;
}

  D.traits.forEach(t => { if (!t.name) e.push("名前のないシナジーがあります"); });
  return e;
}

// ---------- 出力用（数値を正しい型に） ----------
function cleaned(){
  const d = clone(D);
  const n = v => { const x = num(v); return Number.isFinite(x) ? x : v; };
  d.units.forEach(u => { for (const k of ["cost","hp","atk","as","armor","mr","rng"]) u[k] = n(u[k]); });
  d.skills.forEach(s => { for (const k of ["mana","power","dur"]) s[k] = n(s[k] || 0); });
  d.creeps.forEach(c => { for (const k of ["hp","atk","as","armor","mr","rng"]) c[k] = n(c[k]); });
  d.traits.forEach(t => { for (const k in t.stats) t.stats[k] = t.stats[k].map(n); t.thresholds = (t.thresholds||[]).map(Number).filter(x => x > 0); });
  (d.controllers||[]).forEach(c => { c.cost = n(c.cost); c.min_round = n(c.min_round); for (const k in c.params) c.params[k] = n(c.params[k]); });
  (d.items||[]).forEach(it => { it.weight = n(it.weight); for (const k in it.params) it.params[k] = n(it.params[k]); });
  if (d.item_drops) for (const k in d.item_drops) d.item_drops[k] = n(d.item_drops[k]);
  const st = d.settings;
  st.start_hp = n(st.start_hp); st.star_mult = st.star_mult.map(n);
  if (st.select_time !== undefined) st.select_time = n(st.select_time);
  for (const k in st.pool_size) st.pool_size[k] = n(st.pool_size[k]);
  for (const k in st.shop_odds) st.shop_odds[k] = st.shop_odds[k].map(n);
  for (const k in st.xp_to_next) st.xp_to_next[k] = n(st.xp_to_next[k]);
  return d;
}
function jsonText(){ return JSON.stringify(cleaned(), null, 1) + "\n"; }

function confirmInline(tr, msg, yes){
  const cols = tr.children.length;
  const row = document.createElement("tr");
  row.innerHTML = `<td colspan="${cols}"><div class="row"><span>${esc(msg)}</span><button class="primary" data-y>はい</button><button data-n>いいえ</button></div></td>`;
  tr.after(row);
  row.querySelector("[data-y]").onclick = () => { row.remove(); yes(); };
  row.querySelector("[data-n]").onclick = () => row.remove();
  return true;
}

function openImport(text, copyMode){

}
function closeImport(){ document.getElementById("importDlg").hidden = true; }
function loadData(obj, label){
  if (!obj || !obj.units || !obj.skills || !obj.traits || !obj.settings || !obj.creeps) { toast("unit_data.json の形式ではありません"); return false; }
  D = clone(obj); dirty = true; errors = validate(); renderAll(); toast(label + "を読み込みました（まだ共有には保存されていません）"); return true;
}

// ---------- 共有データ（claude.ai上で開いたとき） ----------
let lastSeen = 0;
function applyShared(doc){
  D = clone(doc.data); dirty = false; lastSeen = doc.savedAt || 0;
  shared = {savedAt:doc.savedAt, by:doc.by, byName:""}; errors = validate();
  resolveName();
}
async function resolveName(){
  if (!userApi || !shared || !shared.by) { renderMeta(); return; }
  try { const ps = await userApi.profiles([shared.by]); shared.byName = (ps[shared.by] && ps[shared.by].name) || ""; } catch(e) {}
  renderMeta(); renderHistoryNames();
}
async function loadHistory(){
  if (!db) return;
  try {
    const q = await db.collection("history").orderBy("savedAt", "desc").limit(20).get();
    history = q.docs.map(d => { const x = d.data(); return {id:d.id, savedAt:x.savedAt, version:x.version, by:x.by, byName:""}; });
    renderHistoryNames();
  } catch(e) {}
}
async function renderHistoryNames(){
  if (userApi && history.length) {
    try { const ids = [...new Set(history.map(h => h.by).filter(Boolean))]; const ps = await userApi.profiles(ids); history.forEach(h => h.byName = (ps[h.by] && ps[h.by].name) || ""); } catch(e) {}
  }
  if (tab === "publish") renderMain();
}
async function tryRemote(){
  // GitHub Pages などで開いたときは GitHub の最新を初期値にする
  try { const r = await fetch(REMOTE, {cache:"no-store"}); if (!r.ok) return; const j = await r.json(); if (j && j.units && !dirty && !shared) { D = j; errors = validate(); renderAll(); } } catch(e) {}
}

errors = validate();
renderAll();
if (window.claude && typeof claude.use === "function") {
  claude.use("user").then(u => { userApi = u; resolveName(); }).catch(() => {});
  claude.use("db").then(async d => {
    db = d;
    if (!db) { renderMeta(); tryRemote(); return; }
    const ref = db.doc("editor/current");
    try { const s = await ref.get(); if (s.exists && !dirty) { applyShared(s.data()); renderAll(); } } catch(e) {}
    loadHistory(); renderMeta();
    ref.onSnapshot(s => {
      if (!s.exists) return; const doc = s.data();
      if ((doc.savedAt || 0) <= lastSeen) return;
      if (dirty) { remoteNewer = doc; renderStatus(); }
      else { applyShared(doc); renderAll(); loadHistory(); toast("ほかの人が保存した最新データに更新しました"); }
    }, () => {});
  }).catch(() => { tryRemote(); });
} else tryRemote();
})();
</script>
